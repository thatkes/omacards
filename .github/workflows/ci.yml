name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subjects
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git fetch --no-tags origin main >/dev/null 2>&1 || true
          case "$EVENT_NAME" in
            pull_request)
              range="$BASE_SHA..HEAD"
              ;;
            push)
              case "$BEFORE_SHA" in
                *[!0]*)
                  range="$BEFORE_SHA..HEAD"
                  ;;
                *)
                  base=$(git merge-base HEAD origin/main 2>/dev/null || true)
                  if [ -n "$base" ]; then
                    range="$base..HEAD"
                  else
                    range="HEAD~20..HEAD"
                  fi
                  ;;
              esac
              ;;
            *)
              printf 'Unsupported event %s; skipping subject check\n' "$EVENT_NAME"
              exit 0
              ;;
          esac
          git log --format=%s "$range" | ./bin/check-commit-subject --stdin

      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format qt6-base-dev qt6-declarative-dev qt6-tools-dev libqt6svg6

      - name: Lint
        run: ./bin/lint

      - name: Build
        run: ./bin/build

      - name: Test (offscreen)
        run: ./bin/test --scaling --timing
        env:
          QT_QPA_PLATFORM: offscreen
