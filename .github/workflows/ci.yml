name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-tools-dev libqt6svg6

      - name: Build
        run: ./bin/build

      - name: Test (offscreen)
        run: ./bin/test
        env:
          QT_QPA_PLATFORM: offscreen
