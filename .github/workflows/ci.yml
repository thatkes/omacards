name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subjects
        run: |
          git fetch --no-tags origin main >/dev/null 2>&1 || true
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            printf 'origin/main unavailable; skipping commit subject check\n'
            exit 0
          fi
          if [ -z "$(git log --format=%s origin/main..HEAD)" ]; then
            printf 'No commits in origin/main..HEAD; skipping subject check\n'
            exit 0
          fi
          git log --format=%s origin/main..HEAD | ./bin/check-commit-subject --stdin

      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format qt6-base-dev qt6-declarative-dev qt6-tools-dev libqt6svg6

      - name: Lint
        run: ./bin/lint

      - name: Build
        run: ./bin/build

      - name: Test (offscreen)
        run: ./bin/test
        env:
          QT_QPA_PLATFORM: offscreen
